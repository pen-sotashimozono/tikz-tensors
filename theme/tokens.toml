# One set of design tokens for figures (TikZ), web pages (notes, storyboards)
# and, later, slides. scripts/theme.py writes theme/theme.css and
# tex/tikz-tensors-colors.tex from this file; edit here, never there.
#
# [ramp] is where the colour codes live, and they are two scales rather than
# eight separate colours: a blue from light to dark, a warm from light to dark,
# plus one green and one grey. Everything below names a step on a scale --
# blue2, warm3 -- and never repeats a hex, so a code is written once and a
# meaning is an assignment onto it. A pair that should read as a pair takes the
# same step on the two scales: canl/canr at step 1, edge/edgec at step 3.
#
# The page sections take tints and shades of the same steps, because a page has
# a background and body text and a step does not always clear the contrast a
# reader needs. Each of those values is written as `step +NN% white|black`, and
# the comment carries the ratio it measures. examples/00-palette.tex draws the
# whole map.
#
# One limit worth stating rather than hiding: there is no red and no yellow, so
# `warn` and `bad` are two steps of the one warm scale and differ by weight, not
# by hue. A page must not separate those two by colour alone.

[ramp]
blue1 = "#809eab"   # light
blue2 = "#0082a9"
blue3 = "#005077"   # dark
warm1 = "#ce7e60"   # light
warm2 = "#b65c24"
warm3 = "#88451b"   # dark
green = "#6abe92"
grey  = "#d2d2d3"

[light]
bg      = "grey +88% white"   # page background
card    = "#ffffff"           # cards, figure paper -- the one value off a scale
soft    = "blue1 +90% white"  # table heads, subtle fills
fg      = "blue3 +35% black"  # text,                       12.59:1 on bg
muted   = "blue1 +25% black"  # secondary text,              4.57:1
faint   = "blue1 +6% black"   # captions,                    3.04:1
line    = "grey"              # rules, hairlines
accent  = "blue2 +4% black"   # links, emphasis,             4.52:1
good    = "green +34% black"  #                              4.61:1
good-bg = "green +90% white"
warn    = "warm2 +1% black"   #                              4.51:1
warn-bg = "warm2 +90% white"
bad     = "warm3"             #                              6.90:1
bad-bg  = "warm3 +88% white"

[dark]
bg      = "blue3 +90% black"
card    = "blue3 +84% black"
soft    = "blue3 +78% black"
fg      = "blue1 +80% white"  #                             16.92:1 on bg
muted   = "blue1 +25% white"  #                              9.56:1
faint   = "blue1"             #                              7.11:1
line    = "blue3 +55% black"
accent  = "blue2 +35% white"  #                              7.98:1
good    = "green"             #                              9.03:1
good-bg = "green +88% black"
warn    = "warm2 +30% white"  #                              7.28:1
warn-bg = "warm2 +86% black"
bad     = "warm3 +25% white"  #                              5.05:1
bad-bg  = "warm3 +86% black"

# Meaning, not decoration, and a step of a scale taken whole. Same in light and
# dark (figures keep their own white paper).
[physics]
ele      = "blue2"   # electrons, electron density, continuous (position) legs
nuc      = "warm2"   # nuclei
coef     = "blue1"   # coefficient arrays (tensor boxes), finite-index legs
exchange = "warm3"   # exchange: the term, the hole, the sign under a swap
exact    = "blue3"   # exact / reference results

# Matrix-product states. The gauge is read from colour as much as from the
# direction a triangle points, so the two canonical forms do not share one --
# they take step 1 of the two scales, and the boundaries take step 3, so each
# pair reads as a pair. An operator on the chain stays neutral so that the
# state reads through it.
[mps]
canl   = "blue1"   # left-canonical: isometric from the left
canr   = "warm1"   # right-canonical: isometric from the right
centre = "green"   # the orthogonality centre, on a site or on a bond
mpo    = "grey"    # operator tensors sitting on the chain
gate   = "blue2"   # a gate, or an identity, spanning sites
edge   = "blue3"   # a boundary tensor, where a chain is cut or terminated
edgec  = "warm3"   # its counterpart at the other end
