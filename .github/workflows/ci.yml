name: CI

# Three questions for every change, each its own check:
#   version  did the version move exactly as the change requires, and do the
#            rules behind that still hold (tests/test_version.py; seconds, no TeX)
#   theme    are the generated colour files in step with theme/tokens.toml
#   test     does everything compile with LuaLaTeX and pdfLaTeX, and look as it did
# The rendered pages (and a diff image for any that changed) are uploaded as
# the `rendered` artifact, so a change in appearance can be looked at, not
# only counted. On a pull request the pages this branch draws differently are
# posted as one comment on the PR -- the picture and the link to it -- which
# later pushes replace, so the usual case needs no download and no detour.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Semantic version step
        # On a PR: against the base branch. On main: against the previous commit.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          python3 scripts/version.py check --base "$base"
      - name: The version rules themselves
        run: python3 -m unittest discover -s tests -v

  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/theme.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      # Deep, because the preview step below diffs against the base commit, and
      # the default single-commit fetch does not have it -- the same reason the
      # version job above asks for it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            collection-luatex
            collection-latexrecommended
            collection-fontsrecommended
            collection-pictures
            standalone
            xkeyval
            currfile
            filehook
            gincltex
            svn-prov
            adjustbox
            collectbox
      - name: poppler (pdftocairo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Compile and compare
        run: tests/run.sh
      - name: Upload the rendered pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered
          path: tests/out/rendered/
          if-no-files-found: ignore

      # Only after tests/run.sh has passed, because the preview links this
      # branch's committed reference images and those are the pages CI drew
      # exactly when the comparison said so. The comment follows the shape the
      # other repositories' preview workflows use: one sticky comment, found by
      # its heading and replaced on each push.
      - name: Collect the pages that changed
        id: preview
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/preview.py --base "$BASE" --sha "$SHA" \
                                     --repo "$GITHUB_REPOSITORY" > preview.md
          cat preview.md >> "$GITHUB_STEP_SUMMARY"
          { echo 'body<<PREVIEW_EOF'; cat preview.md; echo PREVIEW_EOF; } >> "$GITHUB_OUTPUT"

      - name: Find the existing preview comment
        id: find-comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Figure preview'

      - name: Post / update the preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: ${{ steps.preview.outputs.body }}
