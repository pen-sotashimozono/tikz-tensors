name: CI

# Every change answers these, each its own job and runner:
#   version     did the version move exactly as the change requires, and do the
#               rules behind that still hold (tests/test_version.py, test_lint.py)
#   theme       are the generated colour files in step with theme/tokens.toml
#   rules       is every style and command drawn somewhere, and does every
#               example follow the figure rules (no TeX needed)
#   compile     does everything compile, with no warning -- once per engine,
#               LuaLaTeX and pdfLaTeX on runners of their own
#   appearance  do the LuaLaTeX pages draw what tests/reference/*.svg draws
#               (from the compile job's PDFs; no TeX needed)
#   test        all of the last four passed. It is one job only so that the
#               name the ruleset on main requires keeps meaning "the tests"
#               however the work under it is split.
# The rendered pages (and a diff list for any that changed) are uploaded as
# the `rendered` artifact. On a pull request the pages this branch draws
# differently are posted as one comment -- the pictures and the links to them
# -- which later pushes replace, so the usual case needs no download.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Semantic version step
        # On a PR: against the base branch. On main: against the previous commit.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          python3 scripts/version.py check --base "$base"
      - name: The version rules and the figure rules themselves
        run: python3 -m unittest discover -s tests -v

  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/theme.py --check

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Coverage and the figure rules (docs/roadmap.md)
        run: tests/run.sh rules

  compile:
    strategy:
      fail-fast: false
      matrix:
        engine: [lualatex, pdflatex]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            collection-luatex
            collection-latexrecommended
            collection-fontsrecommended
            collection-pictures
            standalone
            xkeyval
            currfile
            filehook
            gincltex
            svn-prov
            adjustbox
            collectbox
      - name: Compile with ${{ matrix.engine }}
        run: tests/run.sh compile ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-${{ matrix.engine }}
          path: tests/out/${{ matrix.engine }}/
          if-no-files-found: ignore

  appearance:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      # Deep, because the preview step below diffs against the base commit, and
      # the default single-commit fetch does not have it -- the same reason the
      # version job asks for it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: pdf-lualatex
          path: tests/out/lualatex/
      - name: poppler (pdftocairo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Compare with the references
        run: tests/run.sh compare
      - name: Upload the rendered pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered
          path: tests/out/rendered/
          if-no-files-found: ignore

      # Only after the comparison has passed, because the preview links this
      # branch's committed reference pictures and those are the pages CI drew
      # exactly when the comparison said so. The comment follows the shape the
      # other repositories' preview workflows use: one sticky comment, found by
      # its heading and replaced on each push.
      - name: Collect the pages that changed
        id: preview
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/preview.py --base "$BASE" --sha "$SHA" \
                                     --repo "$GITHUB_REPOSITORY" > preview.md
          cat preview.md >> "$GITHUB_STEP_SUMMARY"
          { echo 'body<<PREVIEW_EOF'; cat preview.md; echo PREVIEW_EOF; } >> "$GITHUB_OUTPUT"

      - name: Find the existing preview comment
        id: find-comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Figure preview'

      - name: Post / update the preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: ${{ steps.preview.outputs.body }}

  test:
    needs: [rules, compile, appearance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "rules, compile, appearance: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
