name: DocumenterPreview

# A pull request's documentation site, built from its branch and published to
# gh-pages as previews/PR<n>/ (scripts/publish.py), with the link in one
# comment on the pull request that later pushes keep. When the pull request is
# closed, merged or not, its preview is removed. Pull requests from forks are
# not previewed: their token cannot push to gh-pages.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python3 scripts/engine.py   # TeX in WebAssembly, for the live figures
          python3 scripts/pages.py _site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          scripts/gh-pages.sh checkout gh-pages
          python3 scripts/publish.py gh-pages _site "previews/PR$PR"
          scripts/gh-pages.sh push gh-pages "docs: preview of #$PR at ${GITHUB_SHA::7}"
      - name: Find the preview comment
        id: find
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "### Documentation preview"
      - name: Post or update it
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ### Documentation preview

            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/PR${{ github.event.pull_request.number }}/

            Built from ${{ github.event.pull_request.head.sha }}; it updates on each push and is removed when this pull request is closed.

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove the preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          scripts/gh-pages.sh checkout gh-pages
          python3 scripts/publish.py gh-pages --remove "previews/PR$PR"
          scripts/gh-pages.sh push gh-pages "docs: remove the preview of #$PR"
